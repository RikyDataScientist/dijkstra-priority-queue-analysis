
    <!DOCTYPE html>
    <html>
    <head>
        <title>Dijkstra Benchmark Dashboard</title>

        <style>

            body {
                font-family: Arial;
                background: #0f172a;
                color: white;
                padding: 30px;
                margin: 0;
            }

            h1 {
                text-align: center;
                margin-bottom: 50px;
                font-size: 40px;
            }

            /* Container utama */
            .container {
                max-width: 1100px;
                margin: auto;
            }

            /* 1 kolom vertikal */
            .grid {
                display: flex;
                flex-direction: column;
                gap: 30px;
            }

            .card {
                background: #1e293b;
                padding: 25px;
                border-radius: 18px;

                box-shadow:
                    0 8px 20px rgba(0,0,0,0.35);
            }

            .card h2 {
                margin-bottom: 20px;
                font-size: 28px;
            }

            img {
                width: 100%;
                border-radius: 14px;
                background: white;
            }

        </style>
    </head>
